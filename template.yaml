AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: AyniAlert serverless environmental alert platform

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
  LogRetentionDays:
    Type: Number
    Default: 14

Globals:
  Function:
    Runtime: python3.13
    Architectures:
      - x86_64
    MemorySize: 128
    Timeout: 10
    Tracing: Active
    Environment:
      Variables:
        APP_ENVIRONMENT: !Ref Environment
        LOG_LEVEL: INFO

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      CorsConfiguration:
        AllowOrigins:
          - !Sub https://${DashboardDistribution.DomainName}
        AllowHeaders:
          - Content-Type
        AllowMethods:
          - GET
        MaxAge: 3600
      AccessLogSettings:
        DestinationArn: !GetAtt HttpApiAccessLogGroup.Arn
        Format: >-
          {"requestId":"$context.requestId","requestTime":"$context.requestTime",
          "httpMethod":"$context.httpMethod","routeKey":"$context.routeKey",
          "status":"$context.status","responseLength":"$context.responseLength",
          "integrationError":"$context.integrationErrorMessage"}
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5

  HttpApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/http-api/ayni-alert-${Environment}
      RetentionInDays: !Ref LogRetentionDays

  DashboardBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub ayni-alert-dashboard-${Environment}-${AWS::AccountId}-${AWS::Region}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Project
          Value: AyniAlert
        - Key: Environment
          Value: !Ref Environment

  DashboardOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ayni-alert-dashboard-${Environment}
        Description: !Sub Signed access to the private AyniAlert ${Environment} dashboard bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  DashboardDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub AyniAlert ${Environment} dashboard
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        Origins:
          - Id: DashboardS3Origin
            DomainName: !GetAtt DashboardBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt DashboardOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: DashboardS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        PriceClass: PriceClass_100
      Tags:
        - Key: Project
          Value: AyniAlert
        - Key: Environment
          Value: !Ref Environment

  DashboardBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DashboardBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action:
              - s3:GetObject
            Resource: !Sub ${DashboardBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${DashboardDistribution}

  ObservationEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub ayni-alert-events-${Environment}
      Description: !Sub Domain events for AyniAlert ${Environment} environment
      Tags:
        - Key: Project
          Value: AyniAlert
        - Key: Environment
          Value: !Ref Environment

  AlertTransitionTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ayni-alert-transitions-${Environment}
      DisplayName: AyniAlert
      Tags:
        - Key: Project
          Value: AyniAlert
        - Key: Environment
          Value: !Ref Environment

  OperationsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ayni-alert-operations-${Environment}
      DisplayName: AyniAlert Operations
      Tags:
        - Key: Project
          Value: AyniAlert
        - Key: Environment
          Value: !Ref Environment

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ayni-alert-health-${Environment}
      CodeUri: backend/src/
      Handler: ayni_alert.handlers.health.lambda_handler
      Description: Returns AyniAlert service availability
      Events:
        HealthRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /health

  HealthFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/ayni-alert-health-${Environment}
      RetentionInDays: !Ref LogRetentionDays

  IngestionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ayni-alert-ingestion-${Environment}
      CodeUri: backend/src/
      Handler: ayni_alert.handlers.ingestion.lambda_handler
      Description: Ingests current environmental data from Open-Meteo
      Timeout: 15
      Environment:
        Variables:
          TABLE_NAME: !Ref ObservationsTable
          EVENT_BUS_NAME: !Ref ObservationEventBus
          LOCATION_ID: LIMA_CORPAC
          LOCATION_LATITUDE: "-12.0982"
          LOCATION_LONGITUDE: "-77.0143"
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt ObservationsTable.Arn
            - Effect: Allow
              Action:
                - events:PutEvents
              Resource: !GetAtt ObservationEventBus.Arn
      Events:
        HourlySchedule:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(1 hour)
            State: ENABLED
            RetryPolicy:
              MaximumRetryAttempts: 2
              MaximumEventAgeInSeconds: 3600

  IngestionFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/ayni-alert-ingestion-${Environment}
      RetentionInDays: !Ref LogRetentionDays

  RepeatedIngestionFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ayni-alert-ingestion-repeated-failures-${Environment}
      AlarmDescription: Two consecutive hourly ingestion executions failed
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref IngestionFunction
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OperationsTopic
      OKActions:
        - !Ref OperationsTopic

  StaleObservationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ayni-alert-observation-stale-${Environment}
      AlarmDescription: No fresh observation has been available for two hours
      Namespace: AyniAlert
      MetricName: FreshObservationAvailable
      Dimensions:
        - Name: Environment
          Value: !Ref Environment
        - Name: LocationId
          Value: LIMA_CORPAC
      Statistic: Sum
      Period: 7200
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref OperationsTopic
      OKActions:
        - !Ref OperationsTopic

  EvaluationDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ayni-alert-evaluation-dlq-${Environment}
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      Tags:
        - Key: Project
          Value: AyniAlert
        - Key: Environment
          Value: !Ref Environment

  EvaluationDeadLetterQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref EvaluationDeadLetterQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowEvaluationRuleFailedDeliveries
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt EvaluationDeadLetterQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt ObservationRecordedRule.Arn
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  EvaluationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ayni-alert-evaluation-${Environment}
      CodeUri: backend/src/
      Handler: ayni_alert.handlers.evaluation.lambda_handler
      Description: Evaluates versioned informational alert rules
      Environment:
        Variables:
          TABLE_NAME: !Ref ObservationsTable
          ALERT_TOPIC_ARN: !Ref AlertTransitionTopic
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !GetAtt ObservationsTable.Arn
            - Effect: Allow
              Action:
                - sns:Publish
              Resource: !Ref AlertTransitionTopic

  ObservationRecordedRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub ayni-alert-evaluate-observation-${Environment}
      Description: Routes persisted observations to the alert evaluator
      EventBusName: !Ref ObservationEventBus
      State: ENABLED
      EventPattern:
        source:
          - ayni-alert.ingestion
        detail-type:
          - ObservationRecorded
      Targets:
        - Id: AlertEvaluationFunction
          Arn: !GetAtt EvaluationFunction.Arn
          RetryPolicy:
            MaximumRetryAttempts: 2
            MaximumEventAgeInSeconds: 3600
          DeadLetterConfig:
            Arn: !GetAtt EvaluationDeadLetterQueue.Arn

  EvaluationFunctionEventBridgePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref EvaluationFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ObservationRecordedRule.Arn

  EvaluationFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/ayni-alert-evaluation-${Environment}
      RetentionInDays: !Ref LogRetentionDays

  LatestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ayni-alert-latest-${Environment}
      MemorySize: 256
      CodeUri: backend/src/
      Handler: ayni_alert.handlers.latest.lambda_handler
      Description: Returns latest conditions and current informational alert states
      Environment:
        Variables:
          TABLE_NAME: !Ref ObservationsTable
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource: !GetAtt ObservationsTable.Arn
      Events:
        LatestRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /v1/locations/{locationId}/latest

  LatestFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/ayni-alert-latest-${Environment}
      RetentionInDays: !Ref LogRetentionDays

  HistoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ayni-alert-history-${Environment}
      MemorySize: 256
      CodeUri: backend/src/
      Handler: ayni_alert.handlers.history.lambda_handler
      Description: Returns bounded environmental observation history
      Environment:
        Variables:
          TABLE_NAME: !Ref ObservationsTable
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource: !GetAtt ObservationsTable.Arn
      Events:
        HistoryRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /v1/locations/{locationId}/history

  HistoryFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/ayni-alert-history-${Environment}
      RetentionInDays: !Ref LogRetentionDays

  ObservationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ayni-alert-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      Tags:
        - Key: Project
          Value: AyniAlert
        - Key: Environment
          Value: !Ref Environment

Outputs:
  ApiBaseUrl:
    Description: Base URL for the deployed HTTP API
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${Environment}
  HealthEndpoint:
    Description: Health endpoint for the deployed environment
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${Environment}/health
  ObservationsTableName:
    Description: DynamoDB table for observations and alert state
    Value: !Ref ObservationsTable
  ObservationEventBusName:
    Description: Custom EventBridge bus for AyniAlert domain events
    Value: !Ref ObservationEventBus
  EvaluationDeadLetterQueueUrl:
    Description: SQS queue for failed alert-evaluation event deliveries
    Value: !Ref EvaluationDeadLetterQueue
  AlertTransitionTopicArn:
    Description: SNS topic for informational alert-transition notifications
    Value: !Ref AlertTransitionTopic
  OperationsTopicArn:
    Description: SNS topic for operator-facing CloudWatch alarm notifications
    Value: !Ref OperationsTopic
  DashboardBucketName:
    Description: Private S3 bucket containing the dashboard build artifacts
    Value: !Ref DashboardBucket
  DashboardDistributionId:
    Description: CloudFront distribution identifier for cache invalidations
    Value: !Ref DashboardDistribution
  DashboardUrl:
    Description: HTTPS URL for the public dashboard
    Value: !Sub https://${DashboardDistribution.DomainName}
